<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELTA寵物運動 | 樂樂晨間占星 (完美下對位極大版)</title>
    <!-- 引入具有占星神祕感的 Google 繁體中文襯線字體 -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030615;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        /* 頂部選單與日期顯示 */
        .header-container {
            text-align: center;
            margin-bottom: 20px;
            z-index: 1000;
        }

        .date-display {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            background: rgba(243, 214, 155, 0.15);
            padding: 6px 20px;
            border-radius: 20px;
            border: 1px dashed #b89655;
            display: inline-block;
        }

        .tab-menu {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(243, 214, 155, 0.1);
            border: 1px solid #b89655;
            color: #f3d69b;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            background: linear-gradient(45deg, #b89655, #f3d69b);
            color: #030615;
            box-shadow: 0 0 15px rgba(243, 214, 155, 0.4);
        }

        /* 核心看板容器 */
        .astrology-container {
            position: relative;
            width: 1000px;
            height: 1000px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            border-radius: 8px;
        }

        .board-page {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .board-page.active {
            display: block;
        }

        #page1 { background-image: url('bg1.png'); }
        #page2 { background-image: url('bg2.png'); }
        #page3 { background-image: url('bg3.png'); }

        /* ✨ 終極置中結構：嚴格控管上下邊界，確保在圓圈最底部的空白處完全置中 */
        .fortune-center-box {
            position: absolute;
            /* 精密縮減寬高，避免邊界往上溢出碰到原圖星座字 */
            width: 280px;
            height: 105px;
            
            /* 水平與垂直雙向絕對居中對齊 */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin: 0 auto;
            
            /* 高設計感超粗襯線體 */
            font-family: 'Noto Serif TC', serif;
            color: #ffffff;
            
            /* 保持大尺寸與設計質感 */
            font-size: 2.1rem; 
            font-weight: 900;
            line-height: 1.4;
            letter-spacing: 1px;
            
            /* 立體燙金多重強效陰影 */
            text-shadow: 
                0 3px 5px rgba(0, 0, 0, 1),
                0 5px 20px rgba(0, 0, 0, 1),
                0 0 12px rgba(243, 214, 155, 0.5);
            
            box-sizing: border-box;
            overflow: hidden;
            pointer-events: none;
        }

        /* 🎯 關鍵修正：將坐標全面垂直下移 30 像素，完美隔離原本的星座標題 */
        .pos-1 { top: 400px; left: 174px; } /* 左上圓圈的最下方中心 */
        .pos-2 { top: 400px; left: 583px; } /* 右上圓圈的最下方中心 */
        .pos-3 { top: 765px; left: 174px; } /* 左下圓圈的最下方中心 */
        .pos-4 { top: 765px; left: 583px; } /* 右下圓圈的最下方中心 */

    </style>
</head>
<body>

    <div class="header-container">
        <div class="date-display" id="current-date">🌟 2026年11月05日 每日運勢</div>
        
        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchPage(1, this)">牡羊 ➔ 巨蟹</button>
            <button class="tab-btn" onclick="switchPage(2, this)">獅子 ➔ 天蠍</button>
            <button class="tab-btn" onclick="switchPage(3, this)">射手 ➔ 雙魚</button>
        </div>
    </div>

    <div class="astrology-container">
        
        <!-- 第一頁：牡羊、金牛、雙子、巨蟹 -->
        <div class="board-page active" id="page1">
            <div class="fortune-center-box pos-1" id="box-Aries">載入中...</div>
            <div class="fortune-center-box pos-2" id="box-Taurus">載入中...</div>
            <div class="fortune-center-box pos-3" id="box-Gemini">載入中...</div>
            <div class="fortune-center-box pos-4" id="box-Cancer">載入中...</div>
        </div>

        <!-- 第二頁：獅子、處女、天秤、天蠍 -->
        <div class="board-page" id="page2">
            <div class="fortune-center-box pos-1" id="box-Leo">載入中...</div>
            <div class="fortune-center-box pos-2" id="box-Virgo">載入中...</div>
            <div class="fortune-center-box pos-3" id="box-Libra">載入中...</div>
            <div class="fortune-center-box pos-4" id="box-Scorpio">載入中...</div>
        </div>

        <!-- 第三頁：射手、摩羯、水瓶、雙魚 -->
        <div class="board-page" id="page3">
            <div class="fortune-center-box pos-1" id="box-Sagittarius">載入中...</div>
            <div class="fortune-center-box pos-2" id="box-Capricorn">載入中...</div>
            <div class="fortune-center-box pos-3" id="box-Aquarius">載入中...</div>
            <div class="fortune-center-box pos-4" id="box-Pisces">載入中...</div>
        </div>

    </div>

    <script {nonce}>
        // 🔮 【優化極簡文案】
        const fortunePool = [
            "行動力滿格，<br>先做再說！",
            "穩住步調，<br>收獲慢慢來。",
            "靈感湧現，<br>適合聊合作！",
            "照顧好情緒，<br>會更順心。",
            "展現才華，<br>成為全場焦點！",
            "運勢順風順水，<br>突破在眼前。",
            "理財直覺精準，<br>偏財運極佳！",
            "深度洞察關鍵，<br>即將驚艷全場。",
            "樂觀磁場爆棚，<br>吸引意外驚喜。",
            "長期的努力，<br>今日終見曙光。",
            "跳脫既有框架，<br>好運藏在細節。",
            "情感充沛，<br>貴人運大幅攀升。"
        ];

        const zodiacs = [
            "Aries", "Taurus", "Gemini", "Cancer", 
            "Leo", "Virgo", "Libra", "Scorpio", 
            "Sagittarius", "Capricorn", "Aquarius", "Pisces"
        ];

        const today = new Date();
        document.getElementById('current-date').innerText = `🌟 ${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日 每日運勢`;

        function updateAllFortunes() {
            const dateSeed = today.getFullYear().toString() + (today.getMonth() + 1).toString() + today.getDate().toString();
            
            zodiacs.forEach((zodiacId) => {
                const combinedSeed = hashString(zodiacId + dateSeed);
                const fortuneIndex = combinedSeed % fortunePool.length;
                
                const targetBox = document.getElementById(`box-${zodiacId}`);
                if (targetBox) {
                    targetBox.innerHTML = fortunePool[fortuneIndex];
                }
            });
        }

        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return Math.abs(hash);
        }

        function switchPage(pageNumber, btn) {
            const pages = document.querySelectorAll('.board-page');
            pages.forEach(p => p.classList.remove('active'));
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(b => b.classList.remove('active'));

            document.getElementById(`page${pageNumber}`).classList.add('active');
            btn.classList.add('active');
        }

        updateAllFortunes();
    </script>
</body>
</html>
